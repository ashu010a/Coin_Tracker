services:
  - type: web
    name: crypto-tracker-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: TRON_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
